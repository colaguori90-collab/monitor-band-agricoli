name: Report Settimanale Bandi Agricoli

on:
  schedule:
    # Ogni lunedì alle 7:00 UTC (8:00 in Italia)
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  monitora-bandi:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Installa dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Esegui monitoraggio
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        DESTINATARIO_EMAIL: ${{ secrets.DESTINATARIO_EMAIL }}
      run: python main.py
      - name: Crea cartella diagnostica
        if: always()
        run: mkdir -p diagnostica

      - name: Scarica HTML Campania e Basilicata
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          os.makedirs("diagnostica", exist_ok=True)

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "it-IT,it;q=0.9,en;q=0.8",
          }

          fonti = {
              "campania": "https://agricoltura.regione.campania.it/bandi.html",
              "basilicata": "https://agricoltura.regione.basilicata.it/bandi-regionali/",
          }

          for nome, url in fonti.items():
              try:
                  risposta = requests.get(url, headers=headers, timeout=45)
                  risposta.raise_for_status()

                  with open(
                      f"diagnostica/{nome}.html",
                      "w",
                      encoding="utf-8"
                  ) as file:
                      file.write(risposta.text)

                  print(f"{nome}: HTML salvato - {len(risposta.text)} caratteri")

              except Exception as errore:
                  with open(
                      f"diagnostica/{nome}_errore.txt",
                      "w",
                      encoding="utf-8"
                  ) as file:
                      file.write(str(errore))

                  print(f"{nome}: errore - {errore}")
          PY

      - name: Carica file diagnostici
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostica-fonti
          path: diagnostica/
          if-no-files-found: warn
          retention-days: 7
